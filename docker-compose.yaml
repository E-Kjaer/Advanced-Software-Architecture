services:
  redis:
    image: redis:latest
    container_name: my-redis
    ports:
        - '6379:6379'
    volumes:
        - redis-data:/data
    environment:
        - REDIS_ARGS=--appendonly yes
    restart: unless-stopped
    
  # The Kafka-setup follows the official guide: https://hub.docker.com/r/apache/kafka
  kafka:
    image: apache/kafka:4.4.0
    container_name: kafka
    healthcheck: # Health check inspired from: https://stackoverflow.com/questions/78131893/how-to-add-health-check-for-kafka-in-docker-compose
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"
        ]
      interval: 5s
      timeout: 5s
      retries: 2
      start_period: 15s
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3

      # Reduce verbosity of Kafka logging
      KAFKA_LOG4J_ROOT_LOGLEVEL: WARN
      KAFKA_TOOLS_LOG4J_LOGLEVEL: WARN
    ports:
      - "9092:9092"

  kafka-init:
    image: apache/kafka:4.4.0
    container_name: kafka_init
    volumes:
      - ./src/kafka-setup.sh:/scripts/kafka-setup.sh:ro
    entrypoint: [ "/bin/bash", "/scripts/kafka-setup.sh" ]
    restart: on-failure:5
    depends_on:
      kafka:
        condition: service_healthy

  tapper-1:
    container_name: tapper_1
    restart: on-failure
    build:
      context: src/gel_tapper
      dockerfile: Dockerfile
    volumes:
      - ./src/logging:/usr/src/app/logs:rw
    environment:
      MACHINE_ID: 1
    depends_on:
      kafka-init:
        condition: service_completed_successfully

  tapper-2:
    container_name: tapper_2
    restart: on-failure
    build:
      context: src/gel_tapper
      dockerfile: Dockerfile
    volumes:
      - ./src/logging:/usr/src/app/logs:rw
    environment:
      MACHINE_ID: 2
    depends_on:
      kafka-init:
        condition: service_completed_successfully

  tapper-3:
    container_name: tapper_3
    restart: on-failure
    build:
      context: src/gel_tapper
      dockerfile: Dockerfile
    volumes:
      - ./src/logging:/usr/src/app/logs:rw
    environment:
      MACHINE_ID: 3
    depends_on:
      kafka-init:
        condition: service_completed_successfully

  sealer:
    container_name: sealer
    restart: on-failure
    build:
      context: src/gel_sealer
      dockerfile: Dockerfile
    volumes:
      - ./src/logging:/usr/src/app/logs
    environment:
      OVERLOAD_MESSAGE_COUNT: ${OVERLOAD_MESSAGE_COUNT:-0}
      OVERLOAD_MESSAGE_INTERVAL_MS: ${OVERLOAD_MESSAGE_INTERVAL_MS:-50}
      BENCHMARK_WARMUP_MS: ${BENCHMARK_WARMUP_MS:-5000}
      RUN_ID: ${RUN_ID:-}
    depends_on:
      kafka-init:
        condition: service_completed_successfully

  coordination-system:
    container_name: pcs
    restart: on-failure
    build:
      context: src/pcs
      dockerfile: Dockerfile
    volumes:
      - ./src/logging:/usr/src/app/logs:rw
    depends_on:
      kafka-init:
        condition: service_completed_successfully

volumes:
  redis-data:
    driver: local